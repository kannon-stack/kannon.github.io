name: "Copilot Setup Steps"

# Runs automatically when this file changes, so the setup can be checked, and
# can be run by hand from the repository's Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job must be called `copilot-setup-steps` or Copilot won't pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Copilot gets its own token for its work, so this job only needs to read the code.
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A trial build (type check + Vite build) proves the environment works before Copilot starts.
      - name: Build the site
        run: npm run build
